# Learn more about configuring your app at
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dfe186df5c1666d4a3d44dcaab4b32f6"
name = "recovery-cart"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
# Use the latest stable Admin API version for webhooks.
# Check https://shopify.dev/docs/api/admin-graphql for current versions.
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at
# https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects"

[auth]
redirect_urls = ["https://example.com/api/auth"]

# -------------------------------------------------------------------
# App-owned shop metafield definition (recommended style)
# Namespace: $app
# Key: settings
# Owner type: SHOP
# -------------------------------------------------------------------
[shop.metafields.app.settings]
type = "json"
name = "Widget Settings"
description = "Configuration for the recovery cart widget"

  [shop.metafields.app.settings.access]
  admin = "merchant_read_write"
  storefront = "public_read"