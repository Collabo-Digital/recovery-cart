# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f4532fcfd39a7d4ad6c44f184d0226dd"
name = "Recovery Cart"
application_url = "https://recovery-cart.vercel.app/"
embedded = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobject_definitions,read_themes,write_metaobject_definitions,read_customers"

[auth]
redirect_urls = [ "https://recovery-cart.vercel.app/api/auth" ]

[shop.metafields.app.settings]
type = "json"
name = "Recovery cart"

  [shop.metafields.app.settings.access]
  storefront = "public_read"
